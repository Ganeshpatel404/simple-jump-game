<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="." aria-label="Neon Snake home"><span class="brand-icon">◆</span><span>NEON SNAKE</span></a>
      <div class="top-actions"><span class="live-dot"></span><span>ARCADE MODE</span><button id="sound" class="icon-button" type="button" aria-label="Toggle sound">⌁</button></div>
    </header>
    <section class="intro-row"><div><p class="kicker">CLASSIC / REWIRED</p><h1>Stay <span>hungry.</span></h1></div><p class="intro-note">A clean, fast little loop.<br />Eat well. Turn sharp.</p></section>
    <section class="game-layout">
      <aside class="score-panel"><div class="panel-label">CURRENT SCORE</div><strong id="score">0000</strong><div class="meter"><span id="score-meter"></span></div><div class="panel-label best-label">BEST RUN</div><b id="high-score">0000</b><div class="difficulty-block"><div class="panel-label">DIFFICULTY</div><div class="difficulty-options" role="group" aria-label="Choose difficulty"><button type="button" data-difficulty="easy">EASY</button><button type="button" data-difficulty="medium">MEDIUM</button><button type="button" data-difficulty="hard">HARD</button><button type="button" data-difficulty="fast">FAST</button></div></div><div class="rule"></div><p class="status-copy" id="status-copy">The board is yours.</p></aside>
      <section class="game-card" aria-label="Neon Snake game">
        <div class="game-head"><span><i class="status-light"></i> LIVE BOARD</span><span id="length">LENGTH 04</span></div>
        <div class="board-wrap"><canvas id="game" width="720" height="540" aria-label="Snake game board"></canvas><div class="game-overlay" id="overlay" hidden><span class="overlay-kicker" id="overlay-kicker">GAME OVER</span><strong id="overlay-title">Sharp turn.</strong><p id="overlay-copy">You scored 0000 points.</p><button id="overlay-action" class="primary-button" type="button">PLAY AGAIN <span>↗</span></button></div></div>
        <div class="game-controls"><button id="pause" class="secondary-button" type="button"><span>Ⅱ</span> PAUSE</button><span class="control-hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows</span><button id="restart" class="secondary-button" type="button"><span>↻</span> RESTART</button></div>
      </section>
    </section>
    <nav class="touch-controls" aria-label="Snake movement controls"><button type="button" data-direction="up" aria-label="Move up">↑</button><div><button type="button" data-direction="left" aria-label="Move left">←</button><button type="button" data-direction="down" aria-label="Move down">↓</button><button type="button" data-direction="right" aria-label="Move right">→</button></div></nav>
    <footer><span>NO WALLS. NO MERCY.</span><span class="footer-line"></span><span>BUILT FOR ONE MORE RUN</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
