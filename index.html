<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <h1>Simple Snake</h1>
    <div class="scoreboard">
      <span>Score: <strong id="score">0</strong></span>
      <span>Best: <strong id="high-score">0</strong></span>
    </div>
    <div class="board-container">
      <canvas id="game" width="480" height="480" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay" hidden>
        <h2 id="overlay-title">Game over</h2>
        <p id="overlay-copy"></p>
        <button id="overlay-action" type="button">Play again</button>
      </div>
    </div>
    <div class="controls">
      <button id="pause" type="button">Pause</button>
      <button id="restart" type="button">Restart</button>
    </div>
    <p class="instructions">Use the arrow keys or WASD to move. Press Space to pause.</p>
    <nav class="touch-controls" aria-label="Snake movement controls">
      <button type="button" data-direction="up" aria-label="Move up">↑</button>
      <div>
        <button type="button" data-direction="left" aria-label="Move left">←</button>
        <button type="button" data-direction="down" aria-label="Move down">↓</button>
        <button type="button" data-direction="right" aria-label="Move right">→</button>
      </div>
    </nav>
  </main>
  <script src="game.js"></script>
</body>
</html>
